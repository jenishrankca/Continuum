[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum"
version = "0.1.0"
description = "Continuum — open-source AI Continuity and Production Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "opencv-python",
  "scenedetect",
  "Pillow",
  "PyYAML",
  "requests",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["continuum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
